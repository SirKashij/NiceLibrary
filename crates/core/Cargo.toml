[package]
name = "nicelibrary-core"
description = "Application core of NiceLibrary. Knows nothing about Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Stand-ins for every port that do nothing (src/stand_ins.rs), for the tests
# of this crate and of the desktop shell.
test-support = []

[dependencies]
# Cover images the person chose, inside the Export File (src/export.rs).
base64 = "0.23"
# Encodes the Cover made from a Local Game's executable icon (src/local_covers.rs)
# and decodes PNG Covers for their dominant hue (src/cover_hue.rs).
png = "0.18"
rusqlite = { version = "0.43", features = ["bundled"] }
# Verifies an Update Package's signature with the updater key (src/updates.rs),
# the crate Tauri's own updater uses.
minisign-verify = "0.2"
# Compares the released version with the one that runs (src/updates.rs).
semver = "1"
serde = { workspace = true }
serde_json = { workspace = true }
# Decode JPEG Covers for their dominant hue (src/cover_hue.rs).
zune-core = "0.5.3"
zune-jpeg = "0.5.15"

[dev-dependencies]
nicelibrary-core = { path = ".", features = ["test-support"] }
jpeg-encoder = "0.7.1"
# Signs made-up Update Packages as `tauri signer sign` does (tests/updates.rs).
minisign = "0.7"
tempfile = { workspace = true }
