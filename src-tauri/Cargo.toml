[package]
name = "nicelibrary"
description = "NiceLibrary desktop shell: thin Tauri adapter over nicelibrary-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nicelibrary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enables the contract tests for the real ports (tests/contract.rs).
contract-tests = []

[[test]]
name = "contract"
required-features = ["contract-tests"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nicelibrary-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
# HTTP client for Covers. The OS's TLS (schannel on Windows) with the OS's
# root certificates, so no certificate bundle ships with the app.
percent-encoding = "2"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# ShellExecuteExW, to open steam:// URLs (src/ports/opener_windows.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
png = "0.18"
tempfile = { workspace = true }
