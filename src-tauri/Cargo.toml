[package]
name = "nicelibrary"
description = "NiceLibrary desktop shell: thin Tauri adapter over nicelibrary-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nicelibrary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enables the contract tests for the real ports (tests/contract.rs).
contract-tests = []

[[test]]
name = "contract"
required-features = ["contract-tests"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nicelibrary-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
