name: Feature request
description: Suggest something NiceLibrary should do.
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. NiceLibrary keeps all data on your computer and talks only to Steam and GitHub, so features that need a server, an account or another online service are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What do you want to do that NiceLibrary does not let you do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could NiceLibrary solve it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered or use today.
