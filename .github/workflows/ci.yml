# Builds and tests every push and pull request.
# Windows is the platform version 1 ships for; Linux is only built, to keep
# the cross-platform door open (ADR-0001). Nothing is published or uploaded.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main keeps its own run; superseded branch runs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (build and test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      # Typechecks and builds the interface into dist/, which the Tauri
      # crate needs at compile time.
      - name: Build frontend
        run: npm run build

      - name: Backend tests
        run: cargo test --workspace --locked

      - name: Contract tests for the real ports
        run: cargo test-contract --locked

      - name: Build app and installer
        run: npm run tauri -- build --ci -- --locked

  linux:
    name: Linux (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      # The bundle targets are Windows installers, so Linux builds the
      # binary only.
      - name: Build app
        run: npm run tauri -- build --ci --no-bundle -- --locked
