# Builds and tests every pull request and every push to main.
# Windows is the platform version 1 ships for; Linux is only built, to keep
# the cross-platform door open (ADR-0001). Nothing is published or uploaded.
#
# Pull requests build a debug binary to stay fast; main builds the release
# and the installer. Only main saves the Rust cache, so pull requests restore
# main's cache instead of filling the quota with their own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main keeps its own run; superseded pull request runs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  # Blocks dependencies whose licenses do not fit MIT (ADR-0004). Both trees
  # are checked against the one allow list in deny.toml.
  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: npm dependencies
        run: node scripts/check-npm-licenses.ts

  windows:
    name: Windows (build and test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      # Typechecks and builds the interface into dist/, which the Tauri
      # crate needs at compile time.
      - name: Build frontend
        run: npm run build

      - name: Backend tests
        run: cargo test --workspace --locked

      - name: Contract tests for the real ports
        run: cargo test-contract --locked

      - name: Build app (debug)
        if: github.ref != 'refs/heads/main'
        run: npm run tauri -- build --ci --debug --no-bundle -- --locked

      - name: Build app and installer (release)
        if: github.ref == 'refs/heads/main'
        run: npm run tauri -- build --ci -- --locked

      # End-to-end tests drive the binary just built through WebDriver:
      # tauri-driver in front of the msedgedriver that matches the runner's
      # WebView2. rust-cache keeps the installed tauri-driver; keep its version
      # in step with e2e/app.ts and CONTRIBUTING.md.
      - name: Install WebDriver tools
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          pwsh scripts/install-msedgedriver.ps1

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          NICELIBRARY_APP: target/${{ github.ref == 'refs/heads/main' && 'release' || 'debug' }}/nicelibrary.exe

      - name: Processes after failed end-to-end tests
        if: failure()
        shell: pwsh
        run: |
          Get-Process | Where-Object Name -Match 'nicelibrary|msedge|tauri' | Format-Table Name, Id, StartTime, MainWindowTitle -AutoSize
          $p = Start-Process -FilePath $env:NICELIBRARY_APP -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Start-Sleep -Seconds 15
          "exited: $($p.HasExited) code: $($p.ExitCode)"
          Get-Process | Where-Object Name -Match 'nicelibrary|msedgewebview2' | Format-Table Name, Id, MainWindowTitle -AutoSize
          Get-Content out.txt, err.txt
          Get-ChildItem "$env:LOCALAPPDATA\io.github.sirkashij.nicelibrary" -Recurse -Depth 1 -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' | Select-Object pv, location
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
        env:
          NICELIBRARY_APP: target/${{ github.ref == 'refs/heads/main' && 'release' || 'debug' }}/nicelibrary.exe

  linux:
    name: Linux (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install npm dependencies
        run: npm ci

      # The bundle targets are Windows installers, so Linux builds the
      # binary only.
      - name: Build app
        run: npm run tauri -- build --ci --no-bundle ${{ github.ref != 'refs/heads/main' && '--debug' || '' }} -- --locked
